name: Daily weather-power papers

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch, translate, write markdown
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python paper_digest.py

      - name: Commit new papers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers data/seen_dois.json
          if git diff --cached --quiet; then
            echo "No new files"
          else
            git commit -m "Add daily weather-power paper abstracts"
            git push
          fi
